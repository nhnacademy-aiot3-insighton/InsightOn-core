# prod 프로파일에서만 다른 설정. 공통 설정은 application.properties 참고.
spring.config.import=classpath:config/prod/actuator.properties, classpath:config/prod/db.properties, classpath:config/prod/redis.properties, classpath:config/prod/redis-telemetry.properties, classpath:config/prod/rabbitmq.properties, classpath:config/prod/influxdb.properties, classpath:config/prod/weather.properties, classpath:config/prod/zipkin.properties

logging.level.root=INFO

# Actuator 공급자 제어 - 통합 환경 Simulator (플랜 §6.4)
actuator.smartthings.base-url=${ACTUATOR_SMARTTHINGS_BASE_URL:http://actuator-simulator:8080/smartthings}
actuator.smartthings.token=${ACTUATOR_SMARTTHINGS_TOKEN:sim-token}
actuator.lg-thinq.base-url=${ACTUATOR_LG_THINQ_BASE_URL:http://actuator-simulator:8080/lg}
actuator.lg-thinq.token=${ACTUATOR_LG_THINQ_TOKEN:sim-token}