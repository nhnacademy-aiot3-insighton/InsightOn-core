spring.application.name=InsightOn-core



# ???? PostgreSQL/Redis/RabbitMQ/Eureka ?? Device API? ??? ?? ???
# ?? ??: VM ?? ?? ?? ??? -Dspring.profiles.active=local ??
# (IntelliJ: Run Configuration > Active profiles: local)

# --- DB: PostgreSQL ?? ???? H2 ?? ---
spring.datasource.url=jdbc:h2:mem:localdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ?????? http://localhost:8080/h2-console ? DB ?? ?? ??
spring.h2.console.enabled=true

# --- Eureka: ?? ?? ??? ??? ???? ---
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# --- Actuator ????? Redis/RabbitMQ? ?? ???? ?? ?? ?? ? ?? ---
management.health.redis.enabled=false
management.health.rabbit.enabled=false