# 기존 PostgreSQL URL/Driver 주석 처리 후 H2로 변경
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# \uAE30\uD0C0 \uAE30\uC874 \uC124\uC815 \uC720\uC9C0
spring.cloud.config.enabled=false
eureka.client.enabled=false
influxdb.url=http://localhost:8087
influxdb.token=test-token
influxdb.org=test-org
influxdb.bucket=test-bucket
weather.api.kma-base-url=http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
weather.api.air-base-url=http://apis.data.go.kr/B552584/ArpltnInforInqireSvc
weather.api.kma-key=mock-test-key
weather.api.air-key=mock-test-key