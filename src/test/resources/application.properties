# H2 Database Configuration for Testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Exclude Redis Repositories, Reactive Redis & Actuator Health Check in Test Environment
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.data.redis.RedisHealthContributorAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.data.redis.RedisReactiveHealthContributorAutoConfiguration

management.health.redis.enabled=false
management.health.defaults.enabled=false

# Cloud & Service Mocks
spring.cloud.config.enabled=false
eureka.client.enabled=false
service-url.auth=http://localhost:0
influxdb.url=http://localhost:8087
influxdb.token=test-token
influxdb.org=test-org
influxdb.bucket=test-bucket
weather.api.kma-base-url=http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
weather.api.kma-midterm-base-url=http://apis.data.go.kr/1360000/MidFcstInfoService
weather.api.air-base-url=http://apis.data.go.kr/B552584/ArpltnInforInqireSvc
weather.api.kma-key=mock-test-key
weather.api.kma-midterm-key=mock-test-midterm-key
weather.api.air-key=mock-test-key

# Actuator 공급자 RestClient - 실제 호출 없이 컨텍스트 로딩만 통과하면 됨
actuator.smartthings.base-url=http://localhost:0/smartthings
actuator.smartthings.token=test-token
actuator.lg-thinq.base-url=http://localhost:0/lg
actuator.lg-thinq.token=test-token
actuator.lg-thinq.api-key=test-api-key
actuator.lg-thinq.client-id=00000000-0000-4000-8000-000000000000
actuator.lg-thinq.country=KR
