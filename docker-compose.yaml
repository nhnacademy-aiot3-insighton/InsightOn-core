services:
  postgres:
    image: postgres:16-alpine
    container_name: insighton-local-postgres
    environment:
      POSTGRES_DB: insighton
      POSTGRES_USER: insighton
      POSTGRES_PASSWORD: insighton
    ports:
      - "5432:5432"
    volumes:
      - insighton-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insighton -d insighton"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: insighton-local-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  influxdb:
    image: influxdb:2
    container_name: insighton-local-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: insighton
      DOCKER_INFLUXDB_INIT_PASSWORD: insighton1234
      DOCKER_INFLUXDB_INIT_ORG: insighton
      DOCKER_INFLUXDB_INIT_BUCKET: core_telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev-local-insighton-token-000
    ports:
      - "8087:8086"
    volumes:
      - insighton-influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: insighton-local-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: insighton-local-zipkin
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9411/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 팀 공용 서비스 디스커버리 서버 (insighton-eureka 저장소를 빌드해 local-jars/에 복사해둔 jar를 그대로 실행)
  eureka:
    image: eclipse-temurin:21-jre-alpine
    container_name: insighton-local-eureka
    volumes:
      - ./local-jars/insighton-eureka.jar:/app/insighton-eureka.jar:ro
    command: ["java", "-jar", "/app/insighton-eureka.jar"]
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

volumes:
  insighton-postgres-data:
  insighton-influxdb-data:
